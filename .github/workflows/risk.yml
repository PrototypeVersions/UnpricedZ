name: Risk Lab benchmarks and daily record

on:
  push:
    branches: [main]
    paths: ['risk_lab/**', 'hub_export/**', 'vendor/unpricedhub/**', 'analysis/variance_decomposition.py', 'site_tools/export_risk_history.py', '.github/workflows/risk.yml']
  schedule:
    - cron: '29 21,22 * * 1-5'
    - cron: '59 23 * * 1-5'
    # Overnight retry slots for the previous US session; immutable issue and entry-open checks apply.
    - cron: '19 1,4 * * 2-6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Risk operation'
        type: choice
        default: daily
        options: [daily, research, controls, bootstrap]

permissions:
  contents: write

concurrency:
  group: unpricedz-publication
  cancel-in-progress: false

jobs:
  risk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            risk_lab/requirements.txt
            hub_export/requirements.txt
      - name: Install pinned risk and contract environment
        run: pip install -r risk_lab/requirements.txt -r hub_export/requirements.txt
      - name: Integrity, timing, model and contract tests
        run: python -m pytest -q
      - name: Export archived 2019–2024 variance forecasts without model refitting
        run: python -m site_tools.export_risk_history
      - name: Select operation
        id: operation
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          if [ -n "$REQUESTED_MODE" ]; then
            MODE="$REQUESTED_MODE"
          elif ! python -c 'import json,pathlib; assert all(p.exists() and json.loads(p.read_text()).get("status") == "completed" for p in map(pathlib.Path,["site/data/risk_research.json","site/data/risk_controls.json"]))'; then
            MODE=bootstrap
          else
            MODE=daily
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Run the independent risk experiment
        run: python -m risk_lab "${{ steps.operation.outputs.mode }}"
      - name: Validate and publish per-task Hub exports
        run: python -m hub_export
      - name: Validate frontend syntax
        run: node --check site/app.js
      - name: Preserve risk records and attempts
        if: always()
        run: |
          git config user.name "unpricedz-risk"
          git config user.email "actions@users.noreply.github.com"
          for path in risk_archive risk_records site/data; do
            if [ -d "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "risk: preserve results and state $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Retain risk diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            risk_archive
            risk_records
            site/data/risk*.json
            site/data/export
          retention-days: 90
      # The site workflow publishes one complete bundle after this job finishes.
