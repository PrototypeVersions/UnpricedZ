name: Site presentation checks
on:
  pull_request:
    paths: ['site/**', 'site_tools/**', 'site_tests/**', 'docs/**', '.github/workflows/site.yml', '.github/workflows/frontend.yml', '.github/workflows/lab.yml', '.github/workflows/risk.yml']
  push:
    branches: [main]
    paths: ['site/**', 'site_tools/**', 'site_tests/**', 'docs/**', '.github/workflows/site.yml', '.github/workflows/frontend.yml', '.github/workflows/lab.yml', '.github/workflows/risk.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            risk_lab/requirements.txt
            hub_export/requirements.txt
            site_tools/requirements.txt
      - name: Install pinned test dependencies
        run: |
          pip install -r risk_lab/requirements.txt -r hub_export/requirements.txt -r site_tools/requirements.txt
          npm install --prefix site_tests --no-save --ignore-scripts linkedom@0.18.12
      - name: Research integrity and display-context tests
        run: python -m pytest -q
      - name: Build disposable display context and on-site references
        run: |
          python site_tools/build_context.py
          python site_tools/build_reference.py
      - name: JavaScript syntax and DOM behavior
        run: |
          node --check site/app.js
          node --check site/risk.js
          node --check site/guide.js
          node --test site_tests/*.test.mjs
      - name: Preserve the reviewed preview
        uses: actions/upload-artifact@v4
        with:
          name: paper-and-ink-site
          path: site
          retention-days: 14
