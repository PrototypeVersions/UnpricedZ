name: Publish UNPRICED site
on:
  push:
    branches: [main]
    paths: ['site/**', 'site_tools/**', 'docs/**', '.github/workflows/site.yml', '.github/workflows/lab.yml', '.github/workflows/risk.yml']
  workflow_run:
    workflows: ['Risk Lab benchmarks and daily record', 'Research and daily publication', 'Registered research program', 'Recover archived program artifact']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: unpricedz-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build complete site from published records
        run: |
          pip install pandas==2.2.3 pandas-market-calendars==5.1.1 -r site_tools/requirements.txt
          python site_tools/build_context.py
          python site_tools/build_reference.py
          node --check site/app.js
          node --check site/risk.js
          node --check site/guide.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Verify the public site matches this deployment
        run: python site_tools/verify_publication.py "${{ steps.deploy.outputs.page_url }}"

